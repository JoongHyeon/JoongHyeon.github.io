<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사진 - 김중인 세무사</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        .gallery-container {
            max-width: 1200px;
            margin: 120px auto 40px;
            padding: 2rem;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            margin-top: 2rem;
        }

        .gallery-item {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            height: 100%;
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
        }

        .gallery-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .gallery-item-content {
            padding: 1.5rem;
        }

        .gallery-item-content h3 {
            color: #2c3e50;
            margin-bottom: 0.8rem;
            font-size: 1.2rem;
        }

        .gallery-item-content p {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            overflow: auto;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90vh;
            margin: auto;
        }

        .modal-image {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
        }

        .close-modal {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .close-modal:hover {
            transform: scale(1.1);
        }

        .modal-caption {
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 10px;
            font-size: 1.1rem;
        }

        /* Navigation buttons */
        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 15px;
            cursor: pointer;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease;
        }

        .modal-nav:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .modal-prev {
            left: 20px;
        }

        .modal-next {
            right: 20px;
        }

        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }

            .gallery-item img {
                height: 250px;
            }

            .modal-content {
                max-width: 95%;
            }

            .modal-nav {
                padding: 10px;
                width: 40px;
                height: 40px;
            }

            .modal-prev {
                left: 10px;
            }

            .modal-next {
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="header"></div>

    <main>
        <div class="gallery-container">
            <h2>사진</h2>
            <div class="gallery-grid">
                <div class="gallery-item" onclick="openModal(0)">
                    <img src="images/office1.png" alt="사무실 외부">
                    <div class="gallery-item-content">
                        <h3>사무실 외부</h3>
                        <p>세무법인대양 중앙지점의 사무실 외부 사진입니다.</p>
                    </div>
                </div>
                <div class="gallery-item" onclick="openModal(1)">
                    <img src="images/office2.png" alt="사무실 내부">
                    <div class="gallery-item-content">
                        <h3>사무실 내부</h3>
                        <p>세무법인대양 중앙지점의 사무실 내부 사진입니다.</p>
                    </div>
                </div>
                <div class="gallery-item" onclick="openModal(2)">
                    <img src="images/office3.png" alt=주요 서비스">
                    <div class="gallery-item-content">
                        <h3>주요 서비스</h3>
                        <p>세무법인대양 중앙지점의 주요 서비스입니다.</p>
                    </div>
                </div>
                <div class="gallery-item" onclick="openModal(3)">
                    <img src="images/office4.png" alt="상담실">
                    <div class="gallery-item-content">
                        <h3>상담실</h3>
                        <p>세무법인대양 중앙지점의 상담실 사진입니다.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">&times;</button>
            <button class="modal-nav modal-prev" onclick="changeImage(-1)">&#10094;</button>
            <img class="modal-image" id="modalImage" src="" alt="">
            <button class="modal-nav modal-next" onclick="changeImage(1)">&#10095;</button>
            <div class="modal-caption" id="modalCaption"></div>
        </div>
    </div>

    <div id="footer"></div>

    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
    <script>
        const images = [
            {
                src: 'images/office1.png',
                alt: '사무실 전경',
                caption: '세무법인대양 중앙지점의 모던한 사무실'
            },
            {
                src: 'images/office2.png',
                alt: '상담 모습',
                caption: '고객님과의 전문적인 세무 상담'
            },
            {
                src: 'images/office3.png',
                alt: '팀 활동',
                caption: '전문가 팀의 활발한 업무 현장'
            },
            {
                src: 'images/office4.png',
                alt: '팀 활동',
                caption: '전문가 팀의 활발한 업무 현장'
            }
        ];

        let currentImageIndex = 0;
        const modal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        const modalCaption = document.getElementById('modalCaption');

        function openModal(index) {
            currentImageIndex = index;
            updateModalImage();
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('show');
            document.body.style.overflow = '';
        }

        function updateModalImage() {
            const image = images[currentImageIndex];
            modalImage.src = image.src;
            modalImage.alt = image.alt;
            modalCaption.textContent = image.caption;
        }

        function changeImage(direction) {
            currentImageIndex = (currentImageIndex + direction + images.length) % images.length;
            updateModalImage();
        }

        // Close modal when clicking outside the image
        modal.addEventListener('click', function(event) {
            if (event.target === modal) {
                closeModal();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', function(event) {
            if (!modal.classList.contains('show')) return;
            
            switch(event.key) {
                case 'Escape':
                    closeModal();
                    break;
                case 'ArrowLeft':
                    changeImage(-1);
                    break;
                case 'ArrowRight':
                    changeImage(1);
                    break;
            }
        });
    </script>
</body>
</html>
