<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인사말 - 김중인 세무사</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        .greeting-container {
            max-width: 800px;
            margin: 120px auto 40px;
            padding: 2rem;
        }
        
        .greeting-content {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .greeting-content h2 {
            color: #2c3e50;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .greeting-content p {
            margin-bottom: 1rem;
            line-height: 1.8;
        }
        
        .signature {
            text-align: right;
            margin-top: 2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="header"></div>

    <main>
        <div class="greeting-container">
            <div class="greeting-content">
                <h2>인사말</h2>
                <p>안녕하세요, 세무법인대양 중앙지점 김중인 세무사입니다.</p>
                <p>저희 세무법인은 고객님의 성공적인 사업을 위해 최선을 다하고 있습니다. 
                   복잡한 세무 문제를 명확하게 해결하고, 고객님의 비즈니스가 안정적으로 성장할 수 있도록 
                   전문적인 조언과 서비스를 제공해 드리겠습니다.</p>
                <p>세무사로서의 전문성과 경험을 바탕으로, 고객님의 세무 문제를 정확하게 파악하고 
                   최적의 해결책을 제시해 드리겠습니다. 항상 고객님의 입장에서 생각하고, 
                   신뢰할 수 있는 파트너가 되도록 하겠습니다.</p>
                <div class="signature">
                    <p>세무법인대양 중앙지점</p>
                    <p>김중인 세무사 드림</p>
                </div>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
