<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오시는 길 - 김중인 세무사</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --primary-color: #3498db;
            --text-color: #2c3e50;
            --text-light: #666;
            --bg-light: #f8f9fa;
            --shadow: 0 2px 5px rgba(0,0,0,0.1);
            --transition: all 0.3s ease;
            --naver-color: #03C75A;
            --naver-hover: #02B351;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        .location-container {
            max-width: 1200px;
            margin: 120px auto 40px;
            padding: 2rem;
        }

        .location-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }

        .location-info {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .location-info h3 {
            color: #2c3e50;
            margin-bottom: 1rem;
        }

        .location-info p {
            margin-bottom: 0.5rem;
            line-height: 1.6;
        }

        .map-container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .map-container iframe {
            width: 100%;
            height: 400px;
            border: none;
            border-radius: 4px;
        }

        .map-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--naver-color);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            text-decoration: none;
            transition: var(--transition);
            font-size: 1rem;
            margin: 0;
            white-space: nowrap;
            font-weight: 500;
        }

        .map-button i {
            margin-right: 0.5rem;
            font-size: 1.2rem;
        }

        .map-button:hover {
            background: var(--naver-hover);
            color: white;
        }

        @media (max-width: 768px) {
            .location-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="header"></div>

    <main>
        <div class="location-container">
            <h2>오시는 길</h2>
            <div class="location-content">
                <div class="location-info">
                    <h3>세무법인대양 중앙지점</h3>
                    <p><strong>세무사:</strong> 김중인</p>
                    <p><strong>소속:</strong> 세무법인대양 중앙지점</p>
                    <p><strong>주소:</strong> 경기도 안산시 단원구 고잔동 518<br>경기 안산시 단원구 화랑로 358 116, 117호</p>
                    <p><strong>전화:</strong> 0507-1479-4462</p>
                    <a href="https://map.naver.com/p/search/%EC%84%B8%EB%AC%B4%EB%B2%95%EC%9D%B8%EB%8C%80%EC%96%91%20%EC%A4%91%EC%95%99%EC%A7%80%EC%A0%90/place/1526559538?c=16.00,0,0,0,dh&isCorrectAnswer=true" target="_blank" class="map-button">
                        <i class="fas fa-map-marker-alt"></i>
                        네이버지도 바로가기
                    </a>
                    <h3>대중교통 이용안내</h3>
                    <p><strong>지하철:</strong> 4호선 중앙역 1번 출구에서 도보 5분</p>
                    <p><strong>버스:</strong> 중앙역 정류장 하차</p>
                    <ul>
                        <li>간선버스: 100, 200, 300</li>
                        <li>지선버스: 2011, 2012</li>
                    </ul>
                </div>
                <div class="map-container">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3175.5387876655584!2d126.82530087677763!3d37.32099647198508!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x357b6f072618a211%3A0xd5d255f2eb72bffe!2z6rK96riw64-EIOyViOyCsOyLnCDri7nsm5Dqtawg6rOg7J6l64-ZIDUxOA!5e0!3m2!1sko!2skr!4v1709701847744!5m2!1sko!2skr"
                        width="100%" 
                        height="400" 
                        style="border:0; border-radius: 8px;" 
                        allowfullscreen="" 
                        loading="lazy" 
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
